  <h1>关于</h1>
  <p class="lead">李强，笔名「踽踽前行的李大虾」。</p>
  <p>山西神池人，现居香港，从事人力资源管理工作。自 2017 年起业余写作，主题围绕电影、纪录片与社会观察。</p>
  <p>公众号「六百击」以影评与社会观察为主；「低语者」记录上海一个停工期房项目的业主维权与自治。近年把镜头转向家乡与家族（《姥姥与我》《神池李白》系列），并在剪辑纪录长片《低语者》。</p>
